<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Portfolio de Mohamed Laamri — automatisme industriel, systèmes embarqués et IoT." />
  <meta name="theme-color" content="#071210" />
  <title>Mohamed Laamri | Automatisme industriel</title>
  <style>
    :root {
      --bg: #071210;
      --bg-soft: #0b1a17;
      --panel: rgba(14, 32, 28, 0.82);
      --panel-solid: #0e201c;
      --text: #f2f8f5;
      --muted: #9eb5ad;
      --line: rgba(190, 226, 211, 0.15);
      --lime: #d7ff65;
      --lime-deep: #a7cf39;
      --aqua: #75e2d1;
      --orange: #ff9b6b;
      --red: #ff796e;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
      --radius-lg: 28px;
      --radius-md: 18px;
      --max: 1180px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(179, 230, 207, 0.032) 1px, transparent 1px),
        linear-gradient(90deg, rgba(179, 230, 207, 0.032) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), transparent 88%);
      z-index: -3;
    }
    body::after {
      content: "";
      position: fixed;
      width: 640px;
      height: 640px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(74, 169, 137, .16), transparent 67%);
      top: -240px;
      right: -140px;
      pointer-events: none;
      z-index: -2;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    .container { width: min(var(--max), calc(100% - 48px)); margin: 0 auto; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    /* Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(7, 18, 16, 0.72);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid transparent;
      transition: border-color .25s ease, background .25s ease;
    }
    .site-header.scrolled { border-color: var(--line); background: rgba(7, 18, 16, .91); }
    .nav {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .brand {
      font-weight: 760;
      letter-spacing: -.04em;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }
    .brand-mark {
      width: 29px;
      height: 29px;
      display: inline-grid;
      place-items: center;
      border-radius: 9px;
      color: #071210;
      background: var(--lime);
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: -.08em;
      box-shadow: 0 0 25px rgba(215, 255, 101, .25);
    }
    .nav-links { display: flex; align-items: center; gap: 22px; color: var(--muted); font-size: .87rem; }
    .nav-links a { transition: color .2s; }
    .nav-links a:hover { color: var(--text); }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .language-switcher { border: 1px solid var(--line); display: flex; border-radius: 999px; padding: 3px; gap: 2px; }
    .language-switcher button {
      color: var(--muted);
      background: transparent;
      border: 0;
      cursor: pointer;
      font-size: .72rem;
      font-weight: 760;
      letter-spacing: .07em;
      padding: 5px 8px;
      border-radius: 999px;
      transition: .2s;
    }
    .language-switcher button.active { color: #071210; background: var(--lime); }
    .header-contact { font-size: .82rem; font-weight: 700; color: #071210; background: var(--lime); padding: 9px 13px; border-radius: 999px; }

    /* Generic sections */
    section { padding: 112px 0; scroll-margin-top: 76px; }
    .section-top { display: flex; align-items: end; justify-content: space-between; gap: 32px; margin-bottom: 42px; }
    .eyebrow { color: var(--lime); text-transform: uppercase; letter-spacing: .16em; font-size: .72rem; font-weight: 800; display: flex; align-items: center; gap: 9px; }
    .eyebrow::before { content: ""; width: 21px; height: 1px; background: currentColor; }
    h1, h2, h3, p { margin-top: 0; }
    h2 { font-size: clamp(2.1rem, 4vw, 3.8rem); line-height: 1.05; letter-spacing: -.055em; margin: 10px 0 0; max-width: 680px; }
    .section-lead { color: var(--muted); max-width: 430px; font-size: .96rem; margin-bottom: 0; }
    .muted { color: var(--muted); }
    .section-number { font-size: .85rem; color: var(--muted); letter-spacing: .08em; }
    .reveal { opacity: 0; transform: translateY(16px); transition: opacity .65s ease, transform .65s ease; }
    .reveal.visible { opacity: 1; transform: none; }

    /* Hero */
    .hero { padding: 74px 0 92px; min-height: min(790px, calc(100vh - 76px)); display: grid; align-items: center; }
    .hero-grid { display: grid; grid-template-columns: 1.06fr .94fr; gap: 58px; align-items: center; }
    .availability { display: inline-flex; align-items: center; gap: 9px; border: 1px solid rgba(215, 255, 101, .31); background: rgba(215, 255, 101, .07); color: #e7ffc0; border-radius: 999px; padding: 7px 12px; font-size: .77rem; font-weight: 650; margin-bottom: 24px; }
    .availability .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 0 rgba(215,255,101,.6); animation: pulse 2s infinite; }
    @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(215,255,101,0); } 100% { box-shadow: 0 0 0 0 rgba(215,255,101,0); } }
    .hero h1 { font-size: clamp(3.4rem, 7.3vw, 6.75rem); line-height: .91; letter-spacing: -.075em; margin: 0 0 20px; }
    .hero h1 .accent { color: var(--lime); }
    .hero-role { font-size: clamp(1.02rem, 1.7vw, 1.34rem); max-width: 590px; color: #c6d9d1; margin: 0 0 26px; }
    .hero-role strong { color: var(--text); font-weight: 650; }
    .hero-copy { color: var(--muted); max-width: 570px; font-size: 1rem; margin-bottom: 32px; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 46px; padding: 0 17px; border-radius: 12px; border: 1px solid var(--line); font-size: .9rem; font-weight: 730; transition: transform .2s ease, border-color .2s ease, background .2s ease; }
    .button:hover { transform: translateY(-2px); }
    .button.primary { color: #06120f; background: var(--lime); border-color: var(--lime); }
    .button.secondary { background: rgba(255,255,255,.025); }
    .button.secondary:hover { border-color: rgba(215,255,101,.52); background: rgba(215,255,101,.055); }
    .arrow { font-size: 1.05rem; line-height: 1; }
    .hero-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 47px; border-top: 1px solid var(--line); padding-top: 22px; gap: 18px; max-width: 610px; }
    .metric { border-right: 1px solid var(--line); padding-right: 14px; }
    .metric:last-child { border-right: 0; }
    .metric strong { font-size: 1.75rem; line-height: 1; letter-spacing: -.06em; display: block; }
    .metric span { color: var(--muted); font-size: .76rem; display: block; margin-top: 7px; }

    .hero-visual { position: relative; min-height: 528px; }
    .visual-shell { position: absolute; inset: 0; border: 1px solid var(--line); overflow: hidden; border-radius: 31px; background: linear-gradient(145deg, rgba(23, 56, 46, .82), rgba(8, 21, 18, .94)); box-shadow: var(--shadow); }
    .visual-shell::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 72% 17%, rgba(117, 226, 209, .2), transparent 24%), radial-gradient(circle at 22% 82%, rgba(215,255,101,.13), transparent 27%); }
    .hero-svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .9; }
    .orbit { transform-origin: center; animation: rotate 24s linear infinite; }
    .orbit-slow { transform-origin: center; animation: rotate-reverse 35s linear infinite; }
    @keyframes rotate { from { transform: rotate(0); } to { transform: rotate(360deg); } }
    @keyframes rotate-reverse { from { transform: rotate(360deg); } to { transform: rotate(0); } }
    .avatar-card { position: absolute; top: 49%; left: 51%; transform: translate(-50%, -50%); width: 194px; text-align: center; }
    .avatar { width: 150px; height: 150px; margin: 0 auto 14px; display: grid; place-items: center; position: relative; isolation: isolate; border-radius: 50%; border: 1px solid rgba(215,255,101,.5); background: linear-gradient(145deg, #b5e95e, #68d6c7); color: #09201a; box-shadow: 0 0 0 13px rgba(215,255,101,.055), 0 0 70px rgba(117,226,209,.21); font-size: 3.3rem; font-weight: 900; letter-spacing: -.12em; }
    .avatar::after { content: ""; position: absolute; width: 15px; height: 15px; bottom: 10px; right: 10px; border: 3px solid var(--panel-solid); border-radius: 50%; background: var(--lime); }
    .avatar-card span { font-size: .71rem; color: #c3d8cf; text-transform: uppercase; letter-spacing: .15em; font-weight: 750; white-space: nowrap; }
    .system-card { position: absolute; padding: 13px 15px; border: 1px solid var(--line); background: rgba(7,18,16,.68); backdrop-filter: blur(10px); border-radius: 13px; min-width: 145px; }
    .system-card small { display: block; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; font-size: .59rem; font-weight: 800; margin-bottom: 4px; }
    .system-card strong { display: block; font-size: .83rem; font-weight: 700; }
    .system-card.one { top: 50px; left: 36px; }
    .system-card.two { bottom: 45px; right: 27px; }
    .system-card .online { color: var(--lime); }
    .system-card .aqua { color: var(--aqua); }
    .visual-corner { position: absolute; top: 18px; right: 20px; color: var(--muted); font-size: .62rem; letter-spacing: .12em; }

    /* About */
    .about-layout { display: grid; grid-template-columns: .9fr 1.1fr; gap: 66px; }
    .about-intro { font-size: clamp(1.25rem, 2vw, 1.65rem); line-height: 1.45; letter-spacing: -.026em; margin-bottom: 24px; }
    .about-intro em { color: var(--lime); font-style: normal; }
    .about-copy { color: var(--muted); max-width: 620px; }
    .about-links { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 27px; }
    .text-link { color: var(--aqua); font-size: .88rem; font-weight: 700; border-bottom: 1px solid rgba(117,226,209,.4); padding-bottom: 2px; }
    .focus-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .focus-card { min-height: 196px; padding: 23px; border-radius: var(--radius-md); border: 1px solid var(--line); background: rgba(12,30,26,.62); }
    .focus-icon { width: 32px; height: 32px; border: 1px solid rgba(215,255,101,.36); border-radius: 9px; color: var(--lime); display: grid; place-items: center; margin-bottom: 31px; font-weight: 900; font-size: .77rem; }
    .focus-card h3 { margin-bottom: 8px; font-size: 1rem; letter-spacing: -.02em; }
    .focus-card p { color: var(--muted); font-size: .84rem; line-height: 1.55; margin: 0; }

    /* Experience */
    .experience-list { border-top: 1px solid var(--line); }
    .experience-card { display: grid; grid-template-columns: 160px minmax(0, 1fr) 160px; gap: 26px; padding: 34px 0; border-bottom: 1px solid var(--line); transition: padding .22s ease, background .22s ease; }
    .experience-card:hover { padding-left: 15px; padding-right: 15px; background: rgba(215,255,101,.035); }
    .experience-period { color: var(--aqua); font-size: .78rem; font-weight: 730; line-height: 1.45; }
    .experience-period span { color: var(--muted); font-weight: 500; display: block; margin-top: 6px; }
    .experience-body h3 { font-size: 1.25rem; letter-spacing: -.035em; margin: 0 0 3px; }
    .experience-role { color: var(--lime); font-size: .87rem; font-weight: 670; margin: 0 0 15px; }
    .experience-summary { color: var(--muted); margin: 0 0 14px; font-size: .91rem; }
    .experience-bullets { list-style: none; padding: 0; margin: 0; display: grid; gap: 7px; }
    .experience-bullets li { color: #bdd0c8; font-size: .84rem; padding-left: 16px; position: relative; }
    .experience-bullets li::before { content: ""; position: absolute; left: 0; top: .63em; width: 5px; height: 5px; border-radius: 50%; background: var(--lime); }
    .experience-tags { display: flex; flex-wrap: wrap; justify-content: flex-end; align-content: start; gap: 6px; }
    .tag { font-size: .67rem; color: #c8dbd4; padding: 5px 8px; line-height: 1.1; border-radius: 999px; border: 1px solid rgba(190,226,211,.17); background: rgba(255,255,255,.025); white-space: nowrap; }

    /* Projects */
    .project-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 17px; }
    .project-card { position: relative; overflow: hidden; min-height: 364px; display: flex; flex-direction: column; justify-content: flex-end; padding: 27px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: linear-gradient(180deg, rgba(22,54,45,.64), rgba(10,25,21,.92)); transition: transform .25s ease, border-color .25s ease; }
    .project-card:hover { transform: translateY(-5px); border-color: rgba(215,255,101,.42); }
    .project-card::before { content: ""; position: absolute; width: 300px; height: 300px; border-radius: 50%; top: -144px; right: -88px; background: radial-gradient(circle, var(--project-color, rgba(117,226,209,.25)), transparent 67%); opacity: .95; }
    .project-visual { position: absolute; top: 26px; left: 27px; right: 27px; height: 132px; border-radius: 17px; border: 1px solid rgba(225,255,245,.14); overflow: hidden; background: rgba(4,17,14,.47); }
    .project-visual svg { width: 100%; height: 100%; display: block; }
    .project-year { color: var(--aqua); font-size: .74rem; letter-spacing: .07em; font-weight: 750; margin-bottom: 10px; }
    .project-card h3 { font-size: 1.5rem; line-height: 1.08; letter-spacing: -.05em; margin: 0 0 11px; max-width: 430px; }
    .project-card p { color: #b6cbc2; margin: 0 0 16px; font-size: .88rem; max-width: 510px; }
    .project-tags { display: flex; flex-wrap: wrap; gap: 6px; position: relative; }
    .project-tags .tag { background: rgba(7,18,16,.48); }

    /* Skills */
    .skills-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
    .skill-group { padding: 22px; border: 1px solid var(--line); border-radius: var(--radius-md); background: rgba(12,29,25,.58); }
    .skill-index { color: var(--lime); font-size: .71rem; font-weight: 820; letter-spacing: .14em; }
    .skill-group h3 { font-size: 1rem; margin: 8px 0 16px; letter-spacing: -.025em; }
    .skill-list { display: flex; flex-wrap: wrap; gap: 6px; }

    /* Education */
    .education-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .education-card { position: relative; min-height: 289px; padding: 25px; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius-md); background: rgba(12,29,25,.58); overflow: hidden; }
    .education-card::after { content: ""; width: 118px; height: 118px; position: absolute; right: -46px; bottom: -47px; border-radius: 50%; background: radial-gradient(circle, rgba(215,255,101,.16), transparent 67%); }
    .education-period { color: var(--aqua); letter-spacing: .08em; font-size: .72rem; font-weight: 780; margin-bottom: 25px; }
    .education-card h3 { font-size: 1.18rem; line-height: 1.1; letter-spacing: -.04em; margin: 0 0 9px; }
    .education-degree { color: var(--lime); font-size: .82rem; font-weight: 680; margin-bottom: 14px; }
    .education-card p { color: var(--muted); font-size: .84rem; margin: 0; }

    /* Contact */
    .contact-section { padding-top: 70px; padding-bottom: 78px; }
    .contact-box { position: relative; overflow: hidden; padding: clamp(30px, 6vw, 68px); border-radius: 32px; background: linear-gradient(130deg, #d7ff65 0%, #9ce3bb 54%, #70d6cb 100%); color: #062119; }
    .contact-box::before { content: ""; position: absolute; right: -7%; top: -47%; width: 450px; height: 450px; border: 1px solid rgba(6,33,25,.16); border-radius: 50%; box-shadow: 0 0 0 45px rgba(6,33,25,.055), 0 0 0 90px rgba(6,33,25,.035); }
    .contact-content { position: relative; display: grid; grid-template-columns: 1.1fr .9fr; align-items: end; gap: 35px; }
    .contact-box .eyebrow { color: #19533e; }
    .contact-box h2 { color: #062119; margin-top: 13px; max-width: 700px; }
    .contact-box p { color: #1d5844; margin: 20px 0 0; max-width: 600px; }
    .contact-actions { display: grid; gap: 10px; justify-items: start; }
    .contact-button { color: #effff7; background: #08251b; border: 1px solid #08251b; }
    .contact-button:hover { background: #11382b; }
    .contact-meta { font-size: .81rem; color: #265b48; display: flex; gap: 12px; flex-wrap: wrap; }
    .contact-meta span { display: inline-flex; align-items: center; gap: 6px; }

    footer { border-top: 1px solid var(--line); padding: 24px 0 32px; color: var(--muted); font-size: .77rem; }
    .footer-content { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
    .footer-content strong { color: #d0e0d9; font-weight: 650; }

    @media (max-width: 1020px) {
      .nav-links { display: none; }
      .hero-grid, .about-layout { grid-template-columns: 1fr; }
      .hero { padding-top: 52px; }
      .hero-visual { min-height: 460px; max-width: 650px; width: 100%; }
      .about-layout { gap: 37px; }
      .skills-grid { grid-template-columns: repeat(2, 1fr); }
      .education-grid { grid-template-columns: 1fr; }
      .education-card { min-height: 230px; }
    }
    @media (max-width: 760px) {
      .container { width: min(var(--max), calc(100% - 32px)); }
      .header-contact { display: none; }
      section { padding: 78px 0; }
      .hero { min-height: auto; padding-bottom: 70px; }
      .hero h1 { font-size: clamp(3.1rem, 15vw, 5rem); }
      .hero-grid { gap: 38px; }
      .hero-visual { min-height: 390px; }
      .avatar { width: 127px; height: 127px; font-size: 2.8rem; }
      .system-card.one { top: 23px; left: 18px; }
      .system-card.two { bottom: 24px; right: 15px; }
      .section-top { display: block; margin-bottom: 29px; }
      .section-lead { margin-top: 18px; }
      .focus-grid, .project-grid { grid-template-columns: 1fr; }
      .experience-card { grid-template-columns: 1fr; gap: 12px; padding: 27px 0; }
      .experience-card:hover { padding-left: 0; padding-right: 0; background: transparent; }
      .experience-tags { justify-content: flex-start; }
      .experience-period span { display: inline; margin-left: 8px; }
      .skills-grid { grid-template-columns: 1fr; }
      .contact-content { grid-template-columns: 1fr; }
      .project-card { min-height: 350px; }
      .hero-metrics { gap: 10px; }
      .metric strong { font-size: 1.48rem; }
      .metric { padding-right: 8px; }
    }
    @media (max-width: 410px) {
      .brand { font-size: .9rem; }
      .brand-mark { width: 26px; height: 26px; }
      .hero-actions .button { width: 100%; }
      .hero-metrics { grid-template-columns: 1fr; }
      .metric { border-right: 0; border-bottom: 1px solid var(--line); padding: 0 0 12px; }
      .metric:last-child { border-bottom: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main>
    <section class="hero" id="home"></section>
    <section id="about"></section>
    <section id="experience"></section>
    <section id="projects"></section>
    <section id="skills"></section>
    <section id="education"></section>
    <section class="contact-section" id="contact"></section>
  </main>
  <footer id="footer"></footer>

  <script>
    const email = "laamrimohamed01@gmail.com";
    const linkedin = "https://www.linkedin.com/in/mohamed-laamri";

          <div class="focus-grid reveal">${a.cards.map(card => `<article class="focus-card"><div class="focus-icon">${card[0]}</div><h3>${card[1]}</h3><p>${card[2]}</p></article>`).join("")}</div>
        </div>`;
    }

    function renderExperience(t) {
      const e = t.experience;
      document.getElementById("experience").innerHTML = `${sectionTop(e.index, e.title, e.lead)}<div class="container experience-list reveal">${e.items.map(item => `<article class="experience-card"><div class="experience-period">${item.period}<span>${item.location}</span></div><div class="experience-body"><h3>${item.company}</h3><p class="experience-role">${item.role}</p><p class="experience-summary">${item.summary}</p><ul class="experience-bullets">${item.bullets.map(b => `<li>${b}</li>`).join("")}</ul></div><div class="experience-tags">${item.tags.map(tag).join("")}</div></article>`).join("")}</div>`;
    }

    function renderProjects(t) {
      const p = t.projects;
      document.getElementById("projects").innerHTML = `${sectionTop(p.index, p.title, p.lead)}<div class="container project-grid">${p.items.map((item, i) => `<article class="project-card reveal" style="--project-color:${["rgba(215,255,101,.25)", "rgba(117,226,209,.25)", "rgba(255,155,107,.22)", "rgba(145,176,255,.22)"][i]}"><div class="project-visual">${visuals[item.visual]}</div><div class="project-year">${item.year}</div><h3>${item.title}</h3><p>${item.text}</p><div class="project-tags">${item.tags.map(tag).join("")}</div></article>`).join("")}</div>`;
    }

    function renderSkills(t) {
      const s = t.skills;
      document.getElementById("skills").innerHTML = `${sectionTop(s.index, s.title, s.lead)}<div class="container skills-grid">${s.groups.map(group => `<article class="skill-group reveal"><div class="skill-index">${group[0]}</div><h3>${group[1]}</h3><div class="skill-list">${group[2].map(tag).join("")}</div></article>`).join("")}</div>`;
    }

    function renderEducation(t) {
      const e = t.education;
      document.getElementById("education").innerHTML = `${sectionTop(e.index, e.title, e.lead)}<div class="container education-grid">${e.items.map(item => `<article class="education-card reveal"><div class="education-period">${item.period}</div><h3>${item.school}</h3><div class="education-degree">${item.degree}</div><p>${item.text}</p></article>`).join("")}</div>`;
    }

    function renderContact(t) {
      const c = t.contact;
      document.getElementById("contact").innerHTML = `<div class="container contact-box reveal"><div class="contact-content"><div><div class="eyebrow">${c.index}</div><h2>${c.title}</h2><p>${c.copy}</p></div><div class="contact-actions"><a class="button contact-button" href="mailto:${email}">${c.button}<span class="arrow">↗</span></a><div class="contact-meta"><span>✉ ${email}</span><span>⌖ ${c.location}</span><span>● ${c.availability}</span></div></div></div></div>`;
      document.getElementById("footer").innerHTML = `<div class="container footer-content"><span>© ${new Date().getFullYear()} <strong>Mohamed Laamri</strong></span><span>${t.footer}</span></div>`;
    }

    function setupReveals() {
      const elements = document.querySelectorAll(".reveal");
      if (!('IntersectionObserver' in window)) { elements.forEach(el => el.classList.add("visible")); return; }
      const observer = new IntersectionObserver(entries => entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add("visible"); observer.unobserve(entry.target); } }), { threshold: .12 });
      elements.forEach(el => observer.observe(el));
    }

    function render() {
      const t = copy[language];
      document.documentElement.lang = language;
      document.title = language === "fr" ? "Mohamed Laamri | Automatisme industriel" : "Mohamed Laamri | Industrial Automation";
      renderHeader(t); renderHero(t); renderAbout(t); renderExperience(t); renderProjects(t); renderSkills(t); renderEducation(t); renderContact(t); setupReveals();
      document.querySelectorAll("[data-language]").forEach(button => button.addEventListener("click", () => { language = button.dataset.language; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }));
    }

    window.addEventListener("scroll", () => document.getElementById("site-header").classList.toggle("scrolled", window.scrollY > 10), { passive: true });
    render();
  </script>
</body>
</html>
