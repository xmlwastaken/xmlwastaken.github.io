<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mohamed Laamri — Industrial Automation, Embedded Systems, IoT and Smart Systems." />
  <meta name="author" content="Mohamed Laamri" />
  <link rel="canonical" href="https://xmlwastaken.github.io/" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080c14;
      --bg2:       #0d1320;
      --bg3:       #111827;
      --card:      rgba(17, 24, 39, 0.82);
      --border:    rgba(99, 179, 237, 0.15);
      --accent:    #38bdf8;
      --accent-rgb: 56, 189, 248;
      --accent2:   #818cf8;
      --accent3:   #34d399;
      --text:      #e2e8f0;
      --muted:     #94a3b8;
      --muted-2:   #64748b;
      --mono:      'JetBrains Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      line-height: 1.6;
    }

    ::selection { background: rgba(56, 189, 248, 0.3); color: #fff; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

    /* Canvas background */
    #canvas-bg {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
      opacity: 0.35;
    }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 2.5rem;
      background: rgba(8, 12, 20, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      transition: padding .3s, background .3s;
    }
    nav.scrolled { padding: .65rem 2.5rem; }
    .nav-logo {
      font-family: var(--mono);
      font-size: 1rem; font-weight: 700;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: .05em;
    }
    .nav-logo span { color: var(--text); }
    .nav-links { display: flex; gap: 1.8rem; list-style: none; align-items: center; }
    .nav-links a {
      font-size: .82rem; font-weight: 500;
      color: var(--muted); text-decoration: none;
      letter-spacing: .04em; text-transform: uppercase;
      transition: color .2s;
      position: relative;
    }
    .nav-links a::after {
      content: ''; position: absolute; bottom: -4px; left: 0;
      width: 0; height: 1px; background: var(--accent);
      transition: width .25s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--accent); }
    .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }

    .nav-controls { display: flex; align-items: center; gap: .75rem; }
    .language-switch {
      display: flex; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: 999px; background: rgba(255,255,255,.02);
    }
    .language-switch button {
      padding: .2rem .55rem; border: 0; border-radius: 999px; color: var(--muted); background: transparent;
      font-family: var(--mono); font-size: .65rem; font-weight: 700; cursor: pointer; transition: all .2s;
    }
    .language-switch button.active { color: #080c14; background: var(--accent); }

    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; }
    .hamburger span { display: block; width: 22px; height: 2px; background: var(--text); transition: all .3s; }

    /* SECTIONS */
    section { position: relative; z-index: 1; }

    /* HERO */
    #hero {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      padding: 7rem 2rem 4rem;
    }
    .hero-inner {
      max-width: 1100px; width: 100%;
      display: grid; grid-template-columns: 1fr auto;
      gap: 4rem; align-items: center;
    }
    .hero-content { text-align: left; }

    .hero-photo-wrap {
      position: relative; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      align-self: center;
    }
    .hero-photo-wrap::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 22px;
      background: linear-gradient(160deg, rgba(56,189,248,.5) 0%, rgba(129,140,248,.3) 50%, rgba(52,211,153,.2) 100%);
      z-index: 0;
    }
    .hero-photo {
      width: 280px; height: 350px;
      border-radius: 20px;
      object-fit: cover; object-position: top center;
      position: relative; z-index: 1;
      box-shadow: 0 25px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(56,189,248,.2), 0 0 40px rgba(56,189,248,.08);
      display: block;
    }

    .hero-tag {
      display: inline-flex; align-items: center; gap: .5rem;
      font-family: var(--mono); font-size: .78rem;
      color: var(--accent); border: 1px solid var(--accent);
      padding: .3rem .9rem; border-radius: 999px;
      margin-bottom: 1.5rem;
      animation: fadeUp .6s ease both;
    }
    .hero-tag .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent3);
      animation: pulse 2s infinite;
    }

    .hero-kicker {
      font-family: var(--mono); font-size: .72rem; color: var(--accent2);
      letter-spacing: .15em; text-transform: uppercase; margin-bottom: .6rem;
    }

    h1.hero-name {
      font-size: clamp(2.5rem, 6vw, 4.8rem);
      font-weight: 800; line-height: 1.05;
      letter-spacing: -.03em;
      background: linear-gradient(135deg, #fff 30%, var(--accent) 70%, var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeUp .6s .1s ease both;
    }

    .hero-title-wrap {
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      color: var(--muted); margin: 1rem 0 1.5rem;
      font-weight: 400;
      animation: fadeUp .6s .2s ease both;
    }
    #typed-text {
      color: var(--accent);
      font-family: var(--mono);
      font-weight: 600;
    }
    .cursor { display: inline-block; width: 2px; height: 1.1em; background: var(--accent); margin-left: 2px; animation: blink 1s infinite; vertical-align: middle; }

    .hero-desc {
      max-width: 680px; margin: 0 0 2rem;
      color: var(--muted); font-size: .95rem; line-height: 1.75;
      animation: fadeUp .6s .3s ease both;
    }

    .hero-cta {
      display: flex; gap: .85rem; justify-content: flex-start; flex-wrap: wrap;
      animation: fadeUp .6s .4s ease both;
    }
    .btn {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .65rem 1.4rem; border-radius: 8px;
      font-size: .85rem; font-weight: 600; text-decoration: none;
      transition: all .25s; cursor: pointer; border: none;
    }
    .btn-primary {
      background: var(--accent); color: #080c14;
    }
    .btn-primary:hover { background: #7dd3fc; transform: translateY(-2px); box-shadow: 0 8px 30px rgba(56,189,248,.35); }
    .btn-outline {
      background: transparent; color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

    .hero-stats {
      display: flex; gap: 2.5rem; justify-content: flex-start; flex-wrap: wrap;
      margin-top: 2.5rem;
      animation: fadeUp .6s .5s ease both;
    }
    .stat { text-align: left; }
    .stat-n {
      font-size: 1.8rem; font-weight: 800;
      font-family: var(--mono);
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-l { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

    .scroll-hint {
      margin-top: 3rem; animation: bounce 2s infinite;
      color: var(--muted); font-size: .8rem;
      display: flex; flex-direction: column; align-items: center; gap: .5rem;
      width: 100%;
    }

    /* SECTION COMMON */
    .section-wrap {
      max-width: 1100px; margin: 0 auto;
      padding: 6rem 2rem;
    }
    .section-label {
      font-family: var(--mono); font-size: .8rem;
      color: var(--accent); text-transform: uppercase; letter-spacing: .12em;
      margin-bottom: .5rem;
    }
    .section-title {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 800; letter-spacing: -.02em;
      margin-bottom: 1rem;
    }
    .section-line {
      width: 60px; height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 2px; margin-bottom: 3.5rem;
    }

    /* ABOUT */
    #about { background: var(--bg2); }
    .about-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: start;
    }
    .about-text p { color: var(--muted); line-height: 1.85; margin-bottom: 1.2rem; }
    .about-text strong { color: var(--text); }
    .about-contacts {
      display: flex; flex-direction: column; gap: .85rem;
      margin-top: 2rem;
    }
    .contact-item {
      display: flex; align-items: center; gap: .85rem;
      font-size: .9rem; color: var(--muted);
      text-decoration: none;
      transition: color .2s;
    }
    .contact-item:hover { color: var(--accent); }
    .contact-icon {
      width: 38px; height: 38px; border-radius: 8px;
      background: rgba(56,189,248,.08); border: 1px solid var(--border);
      display: grid; place-items: center; color: var(--accent);
      flex-shrink: 0;
    }

    .about-right { display: grid; grid-template-columns: 1fr; gap: 1.2rem; }
    .info-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 1.4rem 1.6rem;
      backdrop-filter: blur(8px);
      transition: border-color .25s, transform .25s;
    }
    .info-card:hover { border-color: rgba(56,189,248,.4); transform: translateX(4px); }
    .info-card-symbol { font-family: var(--mono); color: var(--accent); font-size: .75rem; font-weight: 700; margin-bottom: .4rem; }
    .info-card-head {
      display: flex; align-items: center; gap: .7rem;
      font-weight: 600; font-size: .95rem; margin-bottom: .6rem; color: var(--text);
    }
    .info-card p { color: var(--muted); font-size: .875rem; line-height: 1.6; }

    /* EXPERIENCE */
    #experience { background: var(--bg); }
    .timeline { position: relative; }
    .timeline::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent2) 50%, transparent 100%);
    }
    .tl-item {
      padding-left: 2.5rem; margin-bottom: 2.5rem; position: relative;
    }
    .tl-dot {
      position: absolute; left: -6px; top: 6px;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent); border: 3px solid var(--bg);
      box-shadow: 0 0 0 3px rgba(56,189,248,.25);
    }
    .tl-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 1.8rem;
      backdrop-filter: blur(8px);
      transition: border-color .25s, transform .25s;
    }
    .tl-card:hover { border-color: rgba(56,189,248,.4); transform: translateX(6px); }
    .tl-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      flex-wrap: wrap; gap: .5rem; margin-bottom: .4rem;
    }
    .tl-company { font-size: 1.15rem; font-weight: 700; }
    .tl-date {
      font-family: var(--mono); font-size: .78rem; color: var(--accent);
      background: rgba(56,189,248,.1); border: 1px solid rgba(56,189,248,.2);
      padding: .2rem .7rem; border-radius: 999px; white-space: nowrap;
    }
    .tl-role { font-size: .9rem; color: var(--accent2); font-weight: 500; margin-bottom: .3rem; }
    .tl-loc { font-size: .8rem; color: var(--muted); margin-bottom: 1rem; }
    .tl-loc i { margin-right: .3rem; }
    .tl-summary { color: var(--text); font-size: .88rem; margin-bottom: .8rem; }
    .tl-items { list-style: none; display: flex; flex-direction: column; gap: .55rem; margin-bottom: 1.2rem; }
    .tl-items li {
      font-size: .88rem; color: var(--muted); padding-left: 1.2rem; position: relative; line-height: 1.65;
    }
    .tl-items li::before {
      content: '▹'; position: absolute; left: 0; color: var(--accent3); font-size: .8rem;
    }
    .tl-items strong { color: var(--text); }

    /* PROJECTS */
    #projects { background: var(--bg2); }
    .project-controls { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 2rem; }
    .filter-btn {
      padding: .4rem 1rem; border: 1px solid var(--border); border-radius: 999px; background: transparent;
      color: var(--muted); font-family: var(--mono); font-size: .75rem; cursor: pointer; transition: all .2s;
    }
    .filter-btn:hover { color: var(--text); border-color: var(--accent); }
    .filter-btn.active { color: #080c14; background: var(--accent); border-color: var(--accent); font-weight: 700; }

    .proj-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    .proj-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 1.5rem;
      backdrop-filter: blur(8px);
      transition: border-color .25s, transform .25s, box-shadow .25s;
      display: flex; flex-direction: column; cursor: pointer;
    }
    .proj-card:hover {
      border-color: rgba(56,189,248,.5);
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0,0,0,.4), 0 0 0 1px rgba(56,189,248,.1);
    }
    .proj-visual-box {
      height: 150px; border-radius: 10px; overflow: hidden; margin-bottom: 1.2rem;
      border: 1px solid var(--border); background: rgba(8, 12, 20, 0.6);
    }
    .proj-visual-box svg { width: 100%; height: 100%; display: block; }
    .proj-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: .6rem;
    }
    .proj-label-tag {
      font-family: var(--mono); font-size: .7rem; color: var(--accent);
      text-transform: uppercase; letter-spacing: .08em;
    }
    .proj-year { font-family: var(--mono); font-size: .75rem; color: var(--muted-2); }
    .proj-name { font-size: 1.1rem; font-weight: 700; margin-bottom: .6rem; color: var(--text); }
    .proj-desc { font-size: .85rem; color: var(--muted); line-height: 1.65; flex: 1; margin-bottom: 1.2rem; }
    .proj-tags { display: flex; flex-wrap: wrap; gap: .45rem; }

    .tag {
      font-family: var(--mono); font-size: .7rem;
      padding: .2rem .6rem; border-radius: 6px;
      background: rgba(56,189,248,.08); border: 1px solid rgba(56,189,248,.18);
      color: var(--accent);
    }
    .tag.highlight { background: rgba(52,211,153,.1); border-color: rgba(52,211,153,.3); color: var(--accent3); }

    .proj-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 1rem; padding-top: .8rem; border-top: 1px solid rgba(255,255,255,.05); }
    .proj-link {
      display: inline-flex; align-items: center; gap: .4rem;
      font-size: .78rem; font-family: var(--mono); font-weight: 600;
      color: var(--accent); text-decoration: none;
    }

    /* SKILLS */
    #skills { background: var(--bg); }
    .skills-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
    }
    .skill-cat {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 1.6rem;
      backdrop-filter: blur(8px);
      transition: border-color .25s;
    }
    .skill-cat:hover { border-color: rgba(56,189,248,.4); }
    .skill-num { font-family: var(--mono); color: var(--accent); font-size: .75rem; font-weight: 700; }
    .skill-cat-head {
      display: flex; align-items: center; gap: .7rem;
      font-weight: 700; font-size: 1rem; margin: .4rem 0 1.2rem;
    }
    .skill-tags { display: flex; flex-wrap: wrap; gap: .5rem; }
    .stag {
      font-size: .78rem; font-family: var(--mono);
      padding: .3rem .75rem; border-radius: 7px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      color: var(--text);
      transition: all .2s;
    }
    .stag:hover { background: rgba(56,189,248,.1); border-color: rgba(56,189,248,.3); color: var(--accent); }

    /* EDUCATION */
    #education { background: var(--bg2); }
    .edu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
    .edu-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 1.8rem;
      backdrop-filter: blur(8px);
      transition: border-color .25s, transform .25s;
      position: relative; overflow: hidden;
    }
    .edu-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }
    .edu-card.current::before { background: linear-gradient(90deg, var(--accent3), var(--accent)); }
    .edu-card:hover { border-color: rgba(56,189,248,.4); transform: translateY(-4px); }
    .edu-year {
      font-family: var(--mono); font-size: .75rem; color: var(--accent);
      background: rgba(56,189,248,.1); padding: .2rem .6rem; border-radius: 999px;
      display: inline-block; margin-bottom: 1rem;
    }
    .edu-school { font-size: 1.1rem; font-weight: 700; margin-bottom: .3rem; }
    .edu-degree { font-size: .88rem; color: var(--accent2); font-weight: 500; margin-bottom: .6rem; }
    .edu-desc { font-size: .82rem; color: var(--muted); line-height: 1.6; }

    /* CERTIFICATIONS */
    #certifications { background: var(--bg); }
    .cert-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.2rem; }
    .cert-badge-card {
      display: flex; flex-direction: column; justify-content: space-between;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.4rem;
      text-decoration: none; color: var(--text);
      transition: border-color .25s, transform .2s;
    }
    .cert-badge-card:hover { border-color: rgba(56,189,248,.4); transform: translateY(-3px); }
    .cert-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: .8rem; }
    .cert-cat { font-family: var(--mono); font-size: .7rem; color: var(--accent); text-transform: uppercase; }
    .cert-badge-card h3 { font-size: 1rem; font-weight: 700; margin-bottom: .4rem; color: var(--text); }
    .cert-badge-card p { font-size: .8rem; color: var(--muted); margin-bottom: 1rem; line-height: 1.5; }
    .cert-footer { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted-2); }

    /* CONTACT */
    #contact { background: var(--bg); }
    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; }
    .contact-links { display: flex; flex-direction: column; gap: 1rem; }
    .contact-link-card {
      display: flex; align-items: center; gap: 1rem;
      backgroun
