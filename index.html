<title>Mohamed Laamri | Automatismes & systèmes intelligents</title>
<style>
:root{
  --bg:#050609;
  --bg-soft:#0a0b10;
  --surface:rgba(16,14,18,.76);
  --surface-strong:#121116;
  --surface-light:rgba(255,255,255,.045);
  --text:#f6f3f3;
  --muted:#969097;
  --muted-2:#625d64;
  --line:rgba(255,255,255,.105);
  --line-strong:rgba(255,255,255,.20);
  --cyan:#ff3b30;
  --cyan-rgb:255,59,48;
  --lime:#ff5b52;
  --lime-rgb:255,91,82;
  --violet:#ff1744;
  --amber:#ffb15c;
  --danger:#ff6464;
  --radius-xl:30px;
  --radius-lg:22px;
  --radius-md:15px;
  --container:1440px;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-soft:cubic-bezier(.16,1,.3,1);
  --shadow:0 24px 80px rgba(0,0,0,.34);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{
  min-width:320px;margin:0;overflow-x:hidden;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 0%,rgba(var(--cyan-rgb),.065),transparent 30rem),
    radial-gradient(circle at 92% 12%,rgba(154,140,255,.055),transparent 28rem),
    var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-4;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:linear-gradient(to bottom,#000 0%,transparent 78%);
}
::selection{color:#06100d;background:var(--cyan)}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#26333e;border-radius:999px}
::-webkit-scrollbar-thumb:hover{background:#3d505e}

.grain{
  position:fixed;inset:0;z-index:100;pointer-events:none;opacity:.025;
  background-image:radial-gradient(rgba(255,255,255,.45) .5px,transparent .5px);
  background-size:4px 4px;
}
#network-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.28}
.cursor-glow{
  position:fixed;left:0;top:0;z-index:0;width:520px;height:520px;border-radius:50%;
  pointer-events:none;opacity:0;will-change:transform;
  background:radial-gradient(circle,rgba(var(--cyan-rgb),.085),transparent 67%);
  transition:opacity .35s ease;
}
body.has-pointer .cursor-glow{opacity:1}
.scroll-progress{position:fixed;inset:0 0 auto;z-index:120;height:2px;background:transparent}
.scroll-progress span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--cyan),var(--lime));box-shadow:0 0 14px rgba(var(--cyan-rgb),.5)}

.loader{
  position:fixed;inset:0;z-index:200;display:grid;place-items:center;align-content:center;gap:18px;
  color:var(--cyan);background:#070a0f;
  transition:opacity .5s var(--ease),visibility .5s;
}
.loader.done{opacity:0;visibility:hidden}
.loader-mark{
  display:grid;place-items:center;width:62px;height:62px;border:1px solid rgba(var(--cyan-rgb),.55);
  border-radius:18px;font-weight:900;letter-spacing:-.08em;
  box-shadow:0 0 45px rgba(var(--cyan-rgb),.08);
  animation:loaderPulse 1.25s ease-in-out infinite;
}
.loader-line{width:130px;height:2px;overflow:hidden;border-radius:99px;background:rgba(var(--cyan-rgb),.1)}
.loader-line span{display:block;width:42%;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--lime));animation:load 1s var(--ease-soft) infinite}
@keyframes loaderPulse{50%{transform:scale(1.04);box-shadow:0 0 45px rgba(var(--cyan-rgb),.2)}}
@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(340%)}}

.container{width:min(var(--container),calc(100% - 56px));margin-inline:auto}
main,footer{position:relative;z-index:1}
.section{
  position:relative;padding:118px 0;scroll-margin-top:92px;
  content-visibility:auto;contain-intrinsic-size:760px;
}
.section::before{
  content:"";position:absolute;top:0;left:50%;width:min(var(--container),calc(100% - 56px));height:1px;
  transform:translateX(-50%);background:linear-gradient(90deg,transparent,var(--line),transparent);
}
.section-heading{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.48fr);align-items:end;gap:50px;margin-bottom:52px;
}
.eyebrow{
  margin:0 0 14px;display:flex;align-items:center;gap:11px;color:var(--cyan);
  font-size:.69rem;letter-spacing:.19em;font-weight:800;text-transform:uppercase;
}
.eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
.section-heading h2{
  max-width:850px;margin:0;font-size:clamp(2.2rem,5vw,4.8rem);font-weight:760;
  letter-spacing:-.065em;line-height:.96;
}
.section-heading>p{max-width:440px;margin:0 0 4px;color:var(--muted);font-size:.95rem;line-height:1.75}

.site-header{
  position:fixed;top:0;left:0;width:100%;z-index:90;
  border-bottom:1px solid transparent;transition:background .4s var(--ease),border-color .4s var(--ease);
}
.site-header.is-scrolled{
  background:rgba(7,10,15,.72);backdrop-filter:blur(18px) saturate(135%);-webkit-backdrop-filter:blur(18px) saturate(135%);
  border-color:var(--line);
}
.nav{min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:inline-flex;align-items:center;gap:11px;font-size:.86rem;font-weight:800;letter-spacing:-.025em;white-space:nowrap}
.brand-mark{
  display:grid;place-items:center;width:32px;height:32px;border-radius:10px;color:#06100d;background:var(--cyan);
  font-size:.68rem;font-weight:950;letter-spacing:-.08em;box-shadow:0 0 24px rgba(var(--cyan-rgb),.17);
}
.nav>nav{margin-left:auto}
.nav-list{display:flex;align-items:center;gap:25px;margin:0;padding:0;list-style:none}
.nav-list a{
  position:relative;padding:9px 0;color:var(--muted);font-size:.72rem;font-weight:720;
  letter-spacing:.11em;text-transform:uppercase;transition:color .25s var(--ease)
}
.nav-list a::after{content:"";position:absolute;left:0;bottom:2px;width:0;height:1px;background:var(--cyan);transition:width .35s var(--ease)}
.nav-list a:hover,.nav-list a.active{color:var(--text)}
.nav-list a.active::after{width:100%}
.nav-controls{display:flex;align-items:center;gap:8px}
.language-switch{
  display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.025)
}
.language-switch button{
  width:31px;height:26px;padding:0;border:0;border-radius:999px;color:var(--muted);background:transparent;
  font-size:.61rem;font-weight:850;letter-spacing:.08em;transition:background .25s var(--ease),color .25s var(--ease)
}
.language-switch button.active{color:#06100d;background:var(--cyan)}
.nav-resume,.nav-github,.nav-contact{
  min-height:37px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;
  transition:transform .3s var(--ease),border-color .3s var(--ease),background .3s var(--ease),box-shadow .3s var(--ease)
}
.nav-resume,.nav-github{padding:0 11px;border:1px solid var(--line);color:var(--muted);font-size:.68rem;font-weight:800}
.nav-resume:hover,.nav-github:hover{color:var(--text);border-color:var(--line-strong);transform:translateY(-2px)}
.nav-contact{padding:0 15px;background:var(--text);color:#080c11;font-size:.72rem;font-weight:820}
.nav-contact:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(255,255,255,.09)}
.mobile-menu-button{display:none;position:relative;width:39px;height:37px;padding:0;border:1px solid var(--line);border-radius:11px;color:var(--text);background:rgba(255,255,255,.03)}
.mobile-menu-button span,.mobile-menu-button::before,.mobile-menu-button::after{
  content:"";position:absolute;left:10px;right:10px;height:1px;background:currentColor;transition:transform .3s var(--ease),top .3s var(--ease),opacity .2s
}
.mobile-menu-button::before{top:11px}.mobile-menu-button span{top:17px}.mobile-menu-button::after{top:23px}
.mobile-menu-button.open::before{top:17px;transform:rotate(45deg)}
.mobile-menu-button.open span{opacity:0}
.mobile-menu-button.open::after{top:17px;transform:rotate(-45deg)}
.mobile-nav{display:none}

.hero-section{
  min-height:100svh;position:relative;isolation:isolate;display:grid;align-items:center;
  padding:142px 0 80px;overflow:hidden;
}
.hero-section::before{
  content:"";position:absolute;inset:0;z-index:-1;
  background:
    radial-gradient(circle at 78% 47%,rgba(var(--cyan-rgb),.075),transparent 23rem),
    radial-gradient(circle at 91% 22%,rgba(154,140,255,.06),transparent 18rem),
    linear-gradient(180deg,rgba(7,10,15,0) 55%,#070a0f 100%);
}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(390px,.78fr);gap:76px;align-items:center}
.hero-content{max-width:760px}
.availability{
  display:inline-flex;align-items:center;gap:9px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;
  background:rgba(255,255,255,.025);color:var(--muted);font-size:.67rem;font-weight:700;letter-spacing:.06em;
}
.availability-dot{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px rgba(var(--lime-rgb),.08);animation:statusPulse 2.1s ease-in-out infinite}
@keyframes statusPulse{50%{box-shadow:0 0 0 7px rgba(var(--lime-rgb),0);opacity:.65}}
.hero-kicker{margin-top:24px;color:var(--cyan);font-size:.67rem;font-weight:800;letter-spacing:.22em}
.hero-title{
  margin:16px 0 18px;font-size:clamp(4rem,8vw,7.8rem);font-weight:780;letter-spacing:-.085em;line-height:.84;
}
.hero-title .outline{
  color:transparent;-webkit-text-stroke:1px rgba(243,247,247,.34);text-stroke:1px rgba(243,247,247,.34)
}
.hero-title .accent{color:var(--text)}
.hero-role{max-width:690px;margin:0 0 18px;color:#c8d1d6;font-size:clamp(1.05rem,2vw,1.35rem);line-height:1.55}
.hero-role strong{color:var(--text)}
.hero-console{
  display:inline-flex;align-items:center;gap:9px;min-height:34px;margin-bottom:18px;padding:6px 10px;
  border-left:2px solid var(--cyan);background:linear-gradient(90deg,rgba(var(--cyan-rgb),.08),transparent);
  font:700 .73rem/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--cyan)
}
.console-prefix{color:var(--muted-2)}
.typed-role{min-width:18ch}
.hero-description{max-width:670px;margin:0 0 27px;color:var(--muted);font-size:.95rem;line-height:1.85}
.action-row{display:flex;flex-wrap:wrap;gap:10px}
.button{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:45px;padding:0 16px;
  border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025);color:var(--text);
  font-size:.76rem;font-weight:760;transition:transform .35s var(--ease),background .35s var(--ease),border-color .35s var(--ease),box-shadow .35s var(--ease)
}
.button:hover{transform:translateY(-3px);border-color:var(--line-strong);background:rgba(255,255,255,.055)}
.button-primary{background:var(--cyan);border-color:var(--cyan);color:#06100e;box-shadow:0 12px 32px rgba(var(--cyan-rgb),.13)}
.button-primary:hover{background:#ff625a;border-color:#ff625a;box-shadow:0 16px 36px rgba(var(--cyan-rgb),.2)}
.button-github{background:transparent}
.button-icon{font-size:.95rem;line-height:1}
.hero-resume-card{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:13px;max-width:690px;margin-top:25px;
  padding:13px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.025);
}
.resume-card-mark{
  display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:rgba(var(--cyan-rgb),.09);
  border:1px solid rgba(var(--cyan-rgb),.18);color:var(--cyan);font:800 .65rem ui-monospace,monospace
}
.resume-card-copy{display:grid;gap:3px}
.resume-card-copy small{color:var(--muted-2);font-size:.61rem;font-weight:800;letter-spacing:.14em}
.resume-card-copy strong{font-size:.73rem;font-weight:650;color:#d6dde0}
.resume-card-actions{display:flex;gap:12px}
.resume-card-actions a,.inline-link,.certificate-link,.project-open,.contact-resume-actions a{
  color:var(--cyan);font-size:.67rem;font-weight:780;transition:color .25s var(--ease)
}
.resume-card-actions a:hover,.inline-link:hover,.certificate-link:hover,.project-open:hover,.contact-resume-actions a:hover{color:var(--lime)}
.hero-stats{display:flex;gap:34px;margin-top:29px}
.stat{display:grid;gap:1px}
.stat-number{
  font:800 clamp(1.45rem,3vw,2rem)/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:linear-gradient(135deg,var(--text),var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent
}
.stat-label{color:var(--muted-2);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase}
.hero-aside{display:grid;place-items:center}
.system-hud{
  position:relative;width:min(100%,510px);aspect-ratio:1/1;border:1px solid var(--line);border-radius:34px;
  background:
    radial-gradient(circle at center,rgba(var(--cyan-rgb),.075),transparent 34%),
    linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
  box-shadow:var(--shadow);overflow:hidden;
}
.system-hud::before{
  content:"";position:absolute;inset:15%;border:1px dashed rgba(var(--cyan-rgb),.13);border-radius:50%;
  animation:slowSpin 26s linear infinite
}
.system-hud::after{
  content:"";position:absolute;inset:28%;border:1px solid rgba(var(--cyan-rgb),.08);border-radius:50%;
  box-shadow:0 0 70px rgba(var(--cyan-rgb),.06)
}
@keyframes slowSpin{to{transform:rotate(360deg)}}
.hud-top{position:absolute;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;color:var(--muted-2);font:700 .58rem ui-monospace,monospace;letter-spacing:.12em;z-index:4}
.hud-status{display:flex;align-items:center;gap:6px;color:var(--cyan)}
.hud-status i{width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 9px var(--cyan)}
.hud-path{position:absolute;inset:10%;width:80%;height:80%;z-index:1;opacity:.9}
.hud-core{position:absolute;inset:0;display:grid;place-items:center;z-index:3}
.core-node{
  position:relative;width:160px;height:160px;padding:7px;border:1px solid rgba(var(--cyan-rgb),.28);border-radius:50%;
  background:rgba(7,10,15,.68);box-shadow:0 0 0 10px rgba(var(--cyan-rgb),.035),0 0 70px rgba(var(--cyan-rgb),.12);
  animation:coreFloat 5s ease-in-out infinite
}
.core-node::before{content:"";position:absolute;inset:-13px;border:1px solid rgba(var(--cyan-rgb),.09);border-radius:50%;animation:slowSpin 14s linear infinite reverse}
.core-node img{width:100%;height:100%;object-fit:cover;object-position:center top;border-radius:50%;filter:saturate(.8) contrast(1.04)}
@keyframes coreFloat{50%{transform:translateY(-5px)}}
.hud-data{position:absolute;z-index:4;display:grid;gap:2px}
.hud-data small{color:var(--muted-2);font:700 .56rem ui-monospace,monospace;letter-spacing:.12em}
.hud-data strong{font:800 .67rem ui-monospace,monospace;letter-spacing:.07em}
.hud-data.first{left:25px;top:32%}.hud-data.second{right:22px;top:43%}.hud-data.third{left:28px;bottom:25%}
.lime{color:var(--lime)}.aqua{color:var(--cyan)}
.hud-wave{position:absolute;right:20px;bottom:18px;z-index:4}
.hud-wave small{display:block;margin-bottom:5px;color:var(--muted-2);font:700 .52rem ui-monospace,monospace}
.hud-wave>div{display:flex;align-items:end;gap:3px;height:28px}
.hud-wave span{width:3px;height:var(--h);border-radius:3px;background:linear-gradient(var(--cyan),rgba(var(--cyan-rgb),.1));animation:wave 1.3s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes wave{to{transform:scaleY(.35)}}
.scroll-prompt{display:flex;align-items:center;gap:9px;margin-top:18px;color:var(--muted-2);font-size:.65rem;letter-spacing:.08em;text-transform:uppercase}
.scroll-prompt i{width:27px;height:1px;background:var(--line-strong);position:relative}
.scroll-prompt i::after{content:"";position:absolute;right:0;top:-2px;width:5px;height:5px;border-right:1px solid var(--cyan);border-bottom:1px solid var(--cyan);transform:rotate(-45deg)}
.hero-ticker{
  position:absolute;left:0;right:0;bottom:0;overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:rgba(7,10,15,.5)
}
.hero-ticker-track{display:flex;width:max-content;animation:ticker 32s linear infinite}
.hero-ticker span{display:inline-flex;align-items:center;gap:25px;padding:12px 25px;color:var(--muted-2);font:700 .58rem ui-monospace,monospace;letter-spacing:.16em}
.hero-ticker b{color:var(--cyan);font-size:.55rem}
@keyframes ticker{to{transform:translateX(-50%)}}

.section-about{background:linear-gradient(180deg,rgba(255,255,255,.012),transparent)}
.about-layout{display:grid;grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr);gap:70px;align-items:start}
.about-profile{display:flex;align-items:center;gap:15px;margin-bottom:30px}
.about-photo{width:54px;height:54px;border-radius:16px;padding:2px;background:linear-gradient(135deg,var(--cyan),rgba(216,255,103,.3))}
.about-photo img{width:100%;height:100%;object-fit:cover;object-position:center top;border-radius:14px}
.about-profile small{display:block;color:var(--cyan);font:800 .61rem ui-monospace,monospace;letter-spacing:.15em}
.about-profile strong{display:block;margin-top:4px;color:var(--muted);font-size:.7rem;font-weight:650}
.about-statement{margin:0 0 18px;font-size:clamp(1.4rem,2.5vw,2.15rem);line-height:1.18;letter-spacing:-.045em;color:#dfe7e8}
.about-statement em{color:var(--cyan);font-style:normal}
.about-copy{max-width:660px;margin:0;color:var(--muted);font-size:.91rem;line-height:1.9}
.inline-links{display:flex;flex-wrap:wrap;gap:12px 20px;margin-top:25px}
.focus-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.focus-card{
  position:relative;min-height:205px;padding:23px;border:1px solid var(--line);border-radius:20px;overflow:hidden;
  background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.018));
  transition:transform .55s var(--ease),border-color .4s var(--ease),background .4s var(--ease),box-shadow .4s var(--ease);
  will-change:transform
}
.focus-card::before{
  content:"";position:absolute;width:120px;height:120px;right:-50px;bottom:-55px;border-radius:50%;
  background:radial-gradient(circle,rgba(var(--cyan-rgb),.13),transparent 70%);transition:transform .5s var(--ease)
}
.focus-card:hover{border-color:rgba(var(--cyan-rgb),.3);box-shadow:0 18px 55px rgba(0,0,0,.2)}
.focus-card:hover::before{transform:scale(1.5)}
.focus-symbol{color:var(--cyan);font:800 .64rem ui-monospace,monospace;letter-spacing:.12em}
.focus-card h3{margin:27px 0 8px;font-size:1rem;letter-spacing:-.02em}
.focus-card p{margin:0;color:var(--muted);font-size:.78rem;line-height:1.7}

.section-experience{background:var(--bg-soft)}
.experience-list{position:relative;display:grid;gap:16px}
.experience-list::before{content:"";position:absolute;left:15px;top:15px;bottom:15px;width:1px;background:linear-gradient(var(--cyan),rgba(var(--cyan-rgb),.05))}
.experience-card{position:relative;display:grid;grid-template-columns:150px 1fr;gap:28px;padding:26px 26px 26px 54px;border:1px solid var(--line);border-radius:21px;background:rgba(255,255,255,.025);transition:transform .5s var(--ease),border-color .35s var(--ease),background .35s var(--ease)}

/* ---------- CV CTA (no embedded PDF viewer) ---------- */
.resume-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.resume-summary{
  position:relative;overflow:hidden;min-height:310px;padding:34px;
  border:1px solid rgba(var(--cyan-rgb),.24);border-radius:26px;
  background:
    radial-gradient(circle at 84% 18%,rgba(var(--cyan-rgb),.16),transparent 22rem),
    linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.018));
  box-shadow:0 25px 80px rgba(0,0,0,.28);
}
.resume-summary::before{
  content:"";position:absolute;inset:-40%;pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0deg,rgba(var(--cyan-rgb),.10) 55deg,transparent 105deg);
  animation:resumeSweep 8s linear infinite;
}
.resume-summary::after{
  content:"";position:absolute;right:-110px;bottom:-160px;width:330px;height:330px;border-radius:50%;
  border:1px solid rgba(var(--cyan-rgb),.12);
  box-shadow:0 0 0 55px rgba(var(--cyan-rgb),.025),0 0 0 110px rgba(var(--cyan-rgb),.015);
}
@keyframes resumeSweep{to{transform:rotate(360deg)}}
.resume-identity{position:relative;z-index:2;display:flex;align-items:center;gap:15px}
.resume-photo{width:64px;height:64px;padding:2px;border-radius:18px;background:linear-gradient(135deg,var(--cyan),var(--violet))}
.resume-photo img{width:100%;height:100%;object-fit:cover;object-position:center top;border-radius:16px}
.resume-identity small{color:var(--cyan);font:800 .59rem ui-monospace,monospace;letter-spacing:.15em}

.resume-identity p{margin:0;color:var(--muted-2);font-size:.64rem}
.resume-note{position:relative;z-index:2;max-width:720px;margin:28px 0 0;color:var(--muted);font-size:.82rem;line-height:1.8}
.resume-facts{position:relative;z-index:2;display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.resume-facts span{display:flex;align-items:center;gap:6px;color:var(--muted-2);font:700 .58rem ui-monospace,monospace}
.resume-facts i{width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px rgba(var(--cyan-rgb),.5)}
.resume-actions{position:relative;z-index:2;display:flex;margin-top:24px}
.resume-action{
  display:inline-flex;align-items:center;justify-content:center;gap:13px;min-height:47px;padding:0 18px;
  border:1px solid var(--line-strong);border-radius:12px;background:rgba(255,255,255,.04);color:var(--text);
  font-size:.73rem;font-weight:800;transition:transform .4s var(--ease),background .4s var(--ease),border-color .4s var(--ease),box-shadow .4s var(--ease)
}

.resume-action:hover{transform:translateY(-3px);border-color:rgba(var(--cyan-rgb),.45)}
.resume-action b{font-size:1rem;transition:transform .35s var(--ease)}
.resume-action:hover b{transform:translate(3px,-3px)}
.resume-visual{
  position:absolute;right:8%;top:50%;z-index:1;width:270px;height:190px;transform:translateY(-50%) rotate(4deg);
  opacity:.8;pointer-events:none;
}
.resume-paper{
  position:absolute;inset:12px 20px;border:1px solid rgba(255,255,255,.17);border-radius:12px;

}
.resume-paper::before{content:"";position:absolute;left:22px;right:22px;top:24px;height:4px;border-radius:9px;background:rgba(var(--cyan-rgb),.7);box-shadow:0 16px 0 rgba(255,255,255,.11),0 31px 0 rgba(255,255,255,.08),0 46px 0 rgba(255,255,255,.06)}
.resume-paper::after{content:"";position:absolute;right:22px;bottom:20px;width:38px;height:38px;border:1px solid rgba(var(--cyan-rgb),.38);border-radius:10px}
.resume-scan{position:absolute;left:18px;right:18px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 20px var(--cyan);animation:resumeScan 2.8s ease-in-out infinite}
@keyframes resumeScan{0%,100%{top:8px;opacity:.25}50%{top:178px;opacity:1}}

/* ---------- Motion + red atmosphere ---------- */
body::after{
  content:"";position:fixed;inset:-20%;z-index:-3;pointer-events:none;
  background:
    radial-gradient(circle at 18% 22%,rgba(255,59,48,.095),transparent 22%),
    radial-gradient(circle at 83% 34%,rgba(255,23,68,.07),transparent 24%),
    radial-gradient(circle at 50% 92%,rgba(255,59,48,.045),transparent 28%);
  filter:blur(35px);animation:ambientDrift 16s ease-in-out infinite alternate;
}
@keyframes ambientDrift{
  0%{transform:translate3d(-2%,0,0) scale(1)}
  50%{transform:translate3d(2%,-1%,0) scale(1.035)}
  100%{transform:translate3d(-1%,2%,0) scale(1.02)}
}
.hero-section::after{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(255,255,255,.009) 6px);
  mask-image:linear-gradient(to bottom,black,transparent 90%);
}
.section-heading h2{
  text-shadow:0 0 45px rgba(255,59,48,.055);
}
.button-primary,.resume-action.primary{
  position:relative;overflow:hidden;
}
.button-primary::before,.resume-action.primary::before{
  content:"";position:absolute;inset:-2px;transform:translateX(-120%);
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);
  animation:buttonShine 4.5s ease-in-out infinite;
}
@keyframes buttonShine{
  0%,65%{transform:translateX(-120%)}
  85%,100%{transform:translateX(120%)}
}
.focus-card,.project-card,.certificate-card,.skill-group,.education-card,.experience-card{
  isolation:isolate;
}
.focus-card::after,.project-card::before,.certificate-card::after,.skill-group::after,.education-card::after,.experience-card::after{
  content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,transparent 20%,rgba(255,59,48,.07) 50%,transparent 80%);
  transform:translateX(-120%);transition:transform .8s var(--ease);
}
.focus-card:hover::after,.project-card:hover::before,.certificate-card:hover::after,.skill-group:hover::after,.education-card:hover::after,.experience-card:hover::after{
  transform:translateX(120%);
}
.project-card .project-visual{
  background:
    radial-gradient(circle at 50% 45%,rgba(var(--cyan-rgb),.08),transparent 55%),
    linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
}
.project-visual svg{filter:drop-shadow(0 0 9px rgba(var(--cyan-rgb),.12));transition:transform .7s var(--ease),filter .7s var(--ease)}
.project-card:hover .project-visual svg{transform:scale(1.035);filter:drop-shadow(0 0 18px rgba(var(--cyan-rgb),.2))}
.nav-contact,.button-primary,.filter.active{box-shadow:0 0 0 rgba(var(--cyan-rgb),0);animation:redPulse 3.8s ease-in-out infinite}
@keyframes redPulse{
  0%,100%{box-shadow:0 0 0 rgba(var(--cyan-rgb),0)}
  50%{box-shadow:0 0 25px rgba(var(--cyan-rgb),.11)}
}
.experience-card::before{animation:dotPulse 2.6s ease-in-out infinite}
@keyframes dotPulse{
  50%{box-shadow:0 0 0 6px rgba(var(--cyan-rgb),0),0 0 18px rgba(var(--cyan-rgb),.28)}
}


/* =========================================================
   V3 — "ALIVE" MOTION SYSTEM
   The page keeps a continuous animated atmosphere even while
   the user is not hovering anything.
   ========================================================= */

/* Put the animated canvas above section surfaces but below content. */
#network-canvas{
  z-index:1!important;
  opacity:.34!important;
  mix-blend-mode:screen;
  will-change:contents;
}
main,footer{z-index:2!important}
.site-header{z-index:90!important}
.cursor-glow{z-index:3!important}

/* Animated ambient light columns */
.hero-section,
.section{
  isolation:isolate;
}
.hero-section::before{
  animation:heroAtmosphere 12s ease-in-out infinite alternate;
  background:
    radial-gradient(circle at 72% 40%,rgba(var(--cyan-rgb),.15),transparent 23rem),
    radial-gradient(circle at 90% 15%,rgba(255,23,68,.09),transparent 18rem),
    linear-gradient(180deg,transparent 52%,rgba(5,6,9,.65) 100%);
}
.hero-section::after{
  animation:scanDrift 7s linear infinite;
  background:
    linear-gradient(90deg,transparent 0%,rgba(var(--cyan-rgb),.06) 48%,transparent 52%),
    repeating-linear-gradient(0deg,transparent 0 6px,rgba(255,255,255,.012) 7px);
  background-size:180% 100%,100% 100%;
}
@keyframes heroAtmosphere{
  0%{background-position:0 0,100% 0,0 0;transform:scale(1)}
  50%{background-position:15% 8%,85% 15%,0 0;transform:scale(1.025)}
  100%{background-position:-8% -4%,110% 4%,0 0;transform:scale(1.01)}
}
@keyframes scanDrift{
  0%{background-position:-180% 0,0 0}
  100%{background-position:180% 0,0 0}
}

/* Make the fixed atmosphere visible through every section. */
.section::after{
  content:"";
  position:absolute;
  z-index:-1;
  pointer-events:none;
  width:40vw;height:40vw;max-width:560px;max-height:560px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(var(--cyan-rgb),.055),transparent 68%);
  filter:blur(18px);
  opacity:.75;
  animation:sectionOrb 15s ease-in-out infinite alternate;
}
.section:nth-child(odd)::after{left:-18vw;top:12%;animation-delay:-4s}
.section:nth-child(even)::after{right:-18vw;top:32%;animation-delay:-9s}
@keyframes sectionOrb{
  0%{transform:translate3d(0,0,0) scale(.86);opacity:.35}
  50%{transform:translate3d(4vw,-2vw,0) scale(1.08);opacity:.8}
  100%{transform:translate3d(-2vw,3vw,0) scale(.94);opacity:.48}
}

/* Section separators animate like an electronic signal. */
.section::before{
  background:linear-gradient(90deg,transparent 0%,rgba(var(--cyan-rgb),.08) 25%,var(--line) 50%,rgba(var(--cyan-rgb),.08) 75%,transparent 100%);
  background-size:220% 100%;
  animation:lineFlow 6s linear infinite;
}
@keyframes lineFlow{to{background-position:220% 0}}

/* Hero title gets a very slow live gradient. */
.hero-title{
  background:linear-gradient(110deg,#fff 15%,#fff 34%,var(--cyan) 50%,#fff 67%,#fff 85%);
  background-size:260% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:titleFlow 8s ease-in-out infinite;
}
.hero-title .outline{
  -webkit-text-stroke:1px rgba(255,255,255,.36);
  animation:outlinePulse 4s ease-in-out infinite;
}
@keyframes titleFlow{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
@keyframes outlinePulse{
  0%,100%{opacity:.68}
  50%{opacity:1}
}

/* The HUD continuously breathes and its rings rotate. */
.system-hud{
  animation:hudFloat 7s ease-in-out infinite;
  transform-origin:center;
}
@keyframes hudFloat{
  0%,100%{transform:translate3d(0,0,0) rotate(0deg)}
  50%{transform:translate3d(0,-9px,0) rotate(.35deg)}
}
.hud-path{animation:hudPathPulse 3.8s ease-in-out infinite alternate}
@keyframes hudPathPulse{
  from{opacity:.38;transform:scale(.985)}
  to{opacity:1;transform:scale(1.015)}
}
.hud-data.first{animation:dataFloat1 4.4s ease-in-out infinite}
.hud-data.second{animation:dataFloat2 5s ease-in-out infinite}
.hud-data.third{animation:dataFloat3 4.7s ease-in-out infinite}
@keyframes dataFloat1{50%{transform:translate3d(5px,-4px,0)}}
@keyframes dataFloat2{50%{transform:translate3d(-5px,5px,0)}}
@keyframes dataFloat3{50%{transform:translate3d(4px,3px,0)}}

/* Animated red circuit traces behind the page cards. */
.focus-card,.project-card,.certificate-card,.skill-group,.education-card,.experience-card{
  overflow:hidden;
}
.focus-card::before,
.project-card::before,
.certificate-card::before,
.skill-group::before,
.education-card::before,
.experience-card::before{
  content:"";
  position:absolute;
  width:120px;height:120px;
  left:-160px;top:-100px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(var(--cyan-rgb),.22),transparent 67%);
  filter:blur(4px);
  pointer-events:none;
  animation:cardLight 6s ease-in-out infinite;
}
.project-card::before{animation-delay:-1s}
.certificate-card::before{animation-delay:-2s}
.skill-group::before{animation-delay:-3s}
.education-card::before{animation-delay:-4s}
.experience-card::before{animation-delay:-5s}
@keyframes cardLight{
  0%,100%{transform:translate3d(0,0,0);opacity:0}
  18%{opacity:.65}
  55%{transform:translate3d(440px,260px,0);opacity:.25}
  72%{opacity:0}
}

/* Continuous floating for cards — deliberately subtle. */
.focus-card:nth-child(1),.skill-group:nth-child(1),.education-card:nth-child(1){animation:cardFloatA 6.5s ease-in-out infinite}
.focus-card:nth-child(2),.skill-group:nth-child(2),.education-card:nth-child(2){animation:cardFloatB 7.2s ease-in-out infinite}
.focus-card:nth-child(3),.skill-group:nth-child(3),.education-card:nth-child(3){animation:cardFloatC 6.8s ease-in-out infinite}
@keyframes cardFloatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes cardFloatB{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@keyframes cardFloatC{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}

/* Project visual gets a moving scan sweep. */
.project-visual::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(105deg,transparent 30%,rgba(var(--cyan-rgb),.12) 48%,transparent 58%);
  transform:translateX(-120%);
  animation:projectSweep 5.5s ease-in-out infinite;
}
@keyframes projectSweep{
  0%,55%{transform:translateX(-120%)}
  82%,100%{transform:translateX(120%)}
}

/* Skill radar is alive even without hover. */
.skill-radar{animation:radarPulse 4s ease-in-out infinite}
.skill-radar::before{animation:radarRing 8s linear infinite}
.skill-radar::after{animation:radarRing 5s linear infinite reverse}
.skill-radar .radar-dot{animation:radarDot 2s ease-in-out infinite}
@keyframes radarPulse{50%{box-shadow:0 0 55px rgba(var(--cyan-rgb),.1)}}
@keyframes radarRing{to{transform:rotate(360deg)}}
@keyframes radarDot{
  0%,100%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-50%,-50%) scale(1.45);box-shadow:0 0 38px var(--cyan)}
}

/* Animated education timeline. */
.education-card::before{
  animation:educationLine 3.5s ease-in-out infinite;
}
@keyframes educationLine{
  0%,100%{opacity:.35;transform:scaleX(.25);transform-origin:left}
  50%{opacity:1;transform:scaleX(1);transform-origin:left}
}

/* Animated contact panel glow. */
.contact-panel::before{
  content:"";
  position:absolute;
  inset:-50%;
  pointer-events:none;
  background:conic-gradient(from 0deg,transparent,rgba(var(--cyan-rgb),.055),transparent 18%);
  animation:contactRotate 13s linear infinite;
}
@keyframes contactRotate{to{transform:rotate(360deg)}}

/* Loader becomes a short cinematic boot sequence. */
.loader-mark{animation:loaderBoot 1.5s var(--ease) infinite}
@keyframes loaderBoot{
  0%,100%{transform:scale(.96);border-color:rgba(var(--cyan-rgb),.35)}
  50%{transform:scale(1.08);border-color:var(--cyan);box-shadow:0 0 55px rgba(var(--cyan-rgb),.3)}
}

/* Stronger scroll/reveal choreography. */
.reveal{
  opacity:0;
  transform:translate3d(0,38px,0) scale(.985);
  filter:blur(4px);
  transition:
    opacity .85s var(--ease-soft),
    transform .85s var(--ease-soft),
    filter .85s var(--ease-soft);
}
.reveal.visible{
  opacity:1;
  transform:none;
  filter:none;
}

/* Keep hover tilt smooth and prevent fighting the continuous animations. */
.tilt{
  transform-style:preserve-3d;
  will-change:transform;
}

/* Mobile still gets animation — only the expensive effects are reduced. */
@media (max-width:800px){
  #network-canvas{opacity:.20!important}
  .section::after{width:75vw;height:75vw;filter:blur(25px);opacity:.48}
  .system-hud{animation-duration:9s}
  .focus-card:nth-child(n),.skill-group:nth-child(n),.education-card:nth-child(n){animation-duration:8s}
}
@media (max-width:560px){
  #network-canvas{opacity:.13!important}
  .section::after{width:95vw;height:95vw;opacity:.35}
  .hero-section::after{opacity:.35}
  .project-visual::after{animation-duration:7s}
}

/* Only remove motion when the user explicitly requests reduced motion. */



@media (pointer:coarse){
  body::marker{display:none}
  .hero-section{--touch-glow:rgba(var(--cyan-rgb),.08)}
}


/* =========================================================
   V4 — GUARANTEED VISIBLE LIVE BACKGROUND
   This layer is a real DOM layer at z-index 0. It is not hidden
   behind body/section backgrounds like the previous version.
   ========================================================= */
.alive-bg{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 50%,rgba(255,59,48,.025),transparent 48%),
    #050609;
}
.alive-grid{
  position:absolute;
  inset:-25%;
  opacity:.42;
  background-image:
    linear-gradient(rgba(255,59,48,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,59,48,.055) 1px,transparent 1px);
  background-size:70px 70px;
  transform:perspective(650px) rotateX(58deg) scale(1.7);
  transform-origin:center 65%;
  mask-image:linear-gradient(to bottom,transparent 0%,#000 20%,#000 70%,transparent 100%);
  animation:gridMove 14s linear infinite;
}
@keyframes gridMove{
  from{background-position:0 0,0 0}
  to{background-position:0 70px,70px 0}
}
.alive-orb{
  position:absolute;
  width:clamp(220px,30vw,520px);
  aspect-ratio:1;
  border-radius:50%;
  filter:blur(45px);
  opacity:.16;
  mix-blend-mode:screen;
  will-change:transform;
}
.orb-a{
  left:-8%;top:8%;
  background:radial-gradient(circle,#ff2e25 0%,rgba(255,46,37,.4) 25%,transparent 70%);
  animation:orbA 13s ease-in-out infinite alternate;
}
.orb-b{
  right:-8%;top:22%;
  background:radial-gradient(circle,#ff1744 0%,rgba(255,23,68,.35) 25%,transparent 70%);
  animation:orbB 17s ease-in-out infinite alternate;
}
.orb-c{
  left:30%;bottom:-24%;
  background:radial-gradient(circle,#ff443b 0%,rgba(255,68,59,.3) 25%,transparent 70%);
  animation:orbC 19s ease-in-out infinite alternate;
}
@keyframes orbA{
  0%{transform:translate3d(0,0,0) scale(.8)}
  50%{transform:translate3d(17vw,9vh,0) scale(1.18)}
  100%{transform:translate3d(5vw,24vh,0) scale(.94)}
}
@keyframes orbB{
  0%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(-15vw,12vh,0) scale(.78)}
  100%{transform:translate3d(-6vw,-10vh,0) scale(1.2)}
}
@keyframes orbC{
  0%{transform:translate3d(0,0,0) scale(.85)}
  50%{transform:translate3d(20vw,-18vh,0) scale(1.2)}
  100%{transform:translate3d(-12vw,-6vh,0) scale(.95)}
}
.alive-beam{
  position:absolute;
  top:-20%;
  width:1px;
  height:140%;
  background:linear-gradient(to bottom,transparent,rgba(255,59,48,.45),rgba(255,59,48,.06),transparent);
  box-shadow:0 0 24px rgba(255,59,48,.16);
  opacity:.4;
  transform:rotate(24deg);
}
.beam-a{left:22%;animation:beamA 9s ease-in-out infinite}
.beam-b{right:30%;animation:beamB 12s ease-in-out infinite}
@keyframes beamA{
  0%,100%{transform:translateX(-10vw) rotate(24deg);opacity:.05}
  50%{transform:translateX(22vw) rotate(24deg);opacity:.42}
}
@keyframes beamB{
  0%,100%{transform:translateX(15vw) rotate(-25deg);opacity:.04}
  50%{transform:translateX(-18vw) rotate(-25deg);opacity:.3}
}

/* Canvas now sits above the animated atmosphere and below content. */
#network-canvas{
  z-index:1!important;
  opacity:.48!important;
  mix-blend-mode:screen;
}

/* All content is above the animation layer. */
main,footer{position:relative;z-index:2!important}
.site-header{z-index:90!important}

/* Transparent section surfaces let the live background remain visible. */
.section,
.hero-section,
.section-about,
.section-experience,
.section-projects,
.section-certifications,
.section-skills,
.section-education,
.section-resume,

.project-card,
.certificate-card,

/* A visible animated red edge travels around major cards. */

.project-card,
.certificate-card,
.skill-group,
.education-card,
.experience-card,
.resume-summary,
.contact-panel{

.project-card::after,
.certificate-card::after,
.skill-group::after,
.education-card::after,
.experience-card::after,
.resume-summary::after,
.contact-panel::after{
  /* preserve existing pseudo-elements where useful */
}

/* Animated top signal on cards. */

.project-card .project-content::before,
.focus-card h3::before,
.skill-group h3::before,

function setupTilt() {
  if (window.matchMedia("(pointer: coarse)").matches ||
      window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  document.querySelectorAll(".tilt").forEach(card => {
    let frame = 0, px = 50, py = 50, active = false;

    const apply = () => {
      frame = 0;
      if (!active) return;
      const rotationY = (px - 50) / 24;
      const rotationX = (50 - py) / 24;
      card.style.setProperty("--mouse-x", `${px}%`);
      card.style.setProperty("--mouse-y", `${py}%`);
      card.style.transform =
        `perspective(1100px) rotateX(${rotationX}deg) rotateY(${rotationY}deg) translate3d(0,-4px,0)`;
    };

    card.addEventListener("pointermove", event => {
      const rect = card.getBoundingClientRect();
      px = ((event.clientX - rect.left) / rect.width) * 100;
      py = ((event.clientY - rect.top) / rect.height) * 100;
      active = true;
      if (!frame) frame = requestAnimationFrame(apply);
    }, { passive: true });

    card.addEventListener("pointerleave", () => {
      active = false;
      if (frame) cancelAnimationFrame(frame);
      frame = 0;
      card.style.transform = "";
    }, { passive: true });
  });
}
function setupMagnetic() {
  if (window.matchMedia("(pointer: coarse)").matches ||
      window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  document.querySelectorAll(".magnetic").forEach(button => {
    let frame = 0, tx = 0, ty = 0;

    const apply = () => {
      frame = 0;
      button.style.transform = `translate3d(${tx}px, ${ty}px, 0)`;
    };

    button.addEventListener("pointermove", event => {
      const rect = button.getBoundingClientRect();
      tx = (event.clientX - rect.left - rect.width / 2) * .07;
      ty = (event.clientY - rect.top - rect.height / 2) * .07;
      if (!frame) frame = requestAnimationFrame(apply);
    }, { passive: true });

    button.addEventListener("pointerleave", () => {
      if (frame) cancelAnimationFrame(frame);
      frame = 0;
      tx = ty = 0;
      button.style.transform = "";
    }, { passive: true });
  });
}
function initTypewriter() {
  window.clearTimeout(typewriterTimeout);
  const target = el("[data-typed-role]");
  const phrases = content[language].hero.typedPhrases;
  if (!target || !phrases?.length) return;
  const session = ++typewriterSession;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    target.textContent = phrases[0];
    return;
  }
  let phraseIndex = 0;
  let characterIndex = 0;
  let deleting = false;
  const tick = () => {
    if (session !== typewriterSession) return;
    const phrase = phrases[phraseIndex];
    if (!deleting) {
      characterIndex += 1;
      target.textContent = phrase.slice(0, characterIndex);
      if (characterIndex === phrase.length) {
        deleting = true;
        typewriterTimeout = window.setTimeout(tick, 1450);
        return;
      }
      typewriterTimeout = window.setTimeout(tick, 67);
      return;
    }
    characterIndex -= 1;
    target.textContent = phrase.slice(0, characterIndex);
    if (characterIndex === 0) {
      deleting = false;
      phraseIndex = (phraseIndex + 1) % phrases.length;
      typewriterTimeout = window.setTimeout(tick, 250);
      return;
    }
    typewriterTimeout = window.setTimeout(tick, 36);
  };
  target.textContent = "";
  typewriterTimeout = window.setTimeout(tick, 160);
}

function observeReveals() {
  const items = document.querySelectorAll(".reveal:not(.visible)");
  if (!items.length) return;
  if (!("IntersectionObserver" in window) || window.matchMedia("(prefers-reduced-motion: reduce)").matches) { items.forEach(item => item.classList.add("visible")); return; }
  const observer = new IntersectionObserver(entries => entries.forEach(entry => {
    if (entry.isIntersecting) { entry.target.classList.add("visible"); observer.unobserve(entry.target); }
  }), { threshold: .11, rootMargin: "0px 0px -30px" });
  items.forEach(item => observer.observe(item));
}

function observeNavigation() {
  if (!("IntersectionObserver" in window)) return;
  const map = new Map([...document.querySelectorAll(".nav-list a")].map(link => [link.getAttribute("href").slice(1), link]));
  const observer = new IntersectionObserver(entries => entries.forEach(entry => {
    if (!entry.isIntersecting) return;
    map.forEach(link => link.classList.remove("active"));
    const link = map.get(entry.target.id); if (link) link.classList.add("active");
  }), { rootMargin: "-35% 0px -55%", threshold: .02 });
  document.querySelectorAll("main section[id]").forEach(section => observer.observe(section));
}

function initNetworkCanvas() {
  const canvas = el("#network-canvas");
  const context = canvas?.getContext("2d", { alpha: true });
  if (!context || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  let width = 0, height = 0, dpr = 1, particles = [], raf = 0;
  let mouse = { x: -1000, y: -1000 };
  let running = true;

  const rebuild = () => {
    dpr = Math.min(window.devicePixelRatio || 1, 1.25);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    context.setTransform(dpr, 0, 0, dpr, 0, 0);

    const coarse = matchMedia("(pointer: coarse)").matches;
    const count = coarse ? Math.min(22, Math.max(14, Math.round(width / 30))) :
                           Math.min(42, Math.max(20, Math.round(width / 28)));
    particles = Array.from({ length: count }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      vx: (Math.random() - .5) * .12,
      vy: (Math.random() - .5) * .12,
      size: Math.random() * 1.15 + .45
    }));
  };

  const draw = () => {
    if (!running) return;
    context.clearRect(0, 0, width, height);

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;

      if (p.x < -8 || p.x > width + 8) p.vx *= -1;
      if (p.y < -8 || p.y > height + 8) p.vy *= -1;

      const dxm = p.x - mouse.x, dym = p.y - mouse.y;
      if (dxm * dxm + dym * dym < 150 * 150) {
        p.x += dxm * .0018;
        p.y += dym * .0018;
      }

      context.fillStyle = "rgba(255, 59, 48, .48)";
      context.beginPath();
      context.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      context.fill();

      for (let j = i + 1; j < particles.length; j++) {
        const q = particles[j];
        const dx = p.x - q.x, dy = p.y - q.y;
        const distanceSq = dx * dx + dy * dy;
        const max = 105;
        if (distanceSq < max * max) {
          const distance = Math.sqrt(distanceSq);
          context.strokeStyle = `rgba(255, 59, 48, ${.13 * (1 - distance / max)})`;
          context.lineWidth = .55;
          context.beginPath();
          context.moveTo(p.x, p.y);
          context.lineTo(q.x, q.y);
          context.stroke();
        }
      }
    }
    raf = requestAnimationFrame(draw);
  };

  const onVisibility = () => {
    running = !document.hidden;
    if (running && !raf) draw();
  };

  let resizeTimer = 0;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(rebuild, 120);
  }, { passive: true });

  window.addEventListener("pointermove", event => {
    mouse.x = event.clientX;
    mouse.y = event.clientY;
  }, { passive: true });

  document.addEventListener("visibilitychange", onVisibility, { passive: true });
  rebuild();
  draw();
}
function animateCounters() {
  const counters = document.querySelectorAll("[data-count]");
  const observer = new IntersectionObserver(entries => entries.forEach(entry => {
    if (!entry.isIntersecting) return;
    const node = entry.target; const target = node.dataset.count; const numeric = Number(target);
    if (Number.isNaN(numeric) || numeric > 100) return;
    const start = performance.now(); const duration = 850;
    const update = now => { const progress = Math.min(1, (now - start) / duration); const eased = 1 - Math.pow(1 - progress, 3); node.textContent = Math.round(numeric * eased); if (progress < 1) requestAnimationFrame(update); else node.textContent = target; };
    requestAnimationFrame(update); observer.unobserve(node);
  }), { threshold: .8 });
  counters.forEach(counter => observer.observe(counter));
}

renderAll();
initScrollProgress();
initCursorGlow();
initNetworkCanvas();
window.addEventListener("load", () => setTimeout(() => el("#loader").classList.add("done"), 420));
</script>
